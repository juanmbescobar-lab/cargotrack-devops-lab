name: cargotrack

services:
  postgres:
    image: postgres:16
    container_name: cargotrack-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - back_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 3s
      retries: 10
    profiles: ["dev", "ops"]

  redis:
    image: redis:7
    container_name: cargotrack-redis
    ports:
      - "${REDIS_PORT}:6379"
    networks:
      - back_net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10
    profiles: ["dev", "ops"]

networks:
  front_net:
  back_net:

volumes:
  pgdata:
